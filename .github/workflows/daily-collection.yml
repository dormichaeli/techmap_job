name: Daily job collection

on:
  schedule:
    - cron: "0 12 * * *"
      timezone: "Asia/Jerusalem"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: techmap-job-authoritative-checkpoint
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: ${{ github.event_name == 'schedule' && 'checkpoint-automation' || github.event_name == 'workflow_dispatch' && 'checkpoint-production' || 'checkpoint-denied' }}
    steps:
      - name: Restrict authoritative events and runs
        shell: bash
        env:
          CHECKPOINT_AUTOMATION_ENABLED: ${{ vars.CHECKPOINT_AUTOMATION_ENABLED }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule)
              if [[ "$CHECKPOINT_AUTOMATION_ENABLED" != "true" ]]; then
                echo "::error::Scheduled collection requires an explicitly enabled checkpoint-automation environment."
                exit 1
              fi
              ;;
            workflow_dispatch)
              ;;
            *)
              echo "::error::Unsupported authoritative collection event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Authoritative collection is restricted to refs/heads/main."
            exit 1
          fi

      - name: Check out reviewed collector
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up reviewed Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.1

      - name: Fail closed unless embedded SQLite is safe
        run: node --disable-warning=ExperimentalWarning scripts/verify-runtime.js

      - name: Run complete regression suite
        run: npm test

      - name: Mint repository-scoped checkpoint write token
        id: checkpoint-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CHECKPOINT_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHECKPOINT_GITHUB_APP_PRIVATE_KEY }}
          owner: dormichaeli
          repositories: techmap_job_checkpoints
          permission-contents: write

      - name: Restore, collect, checkpoint, verify, and promote
        env:
          CHECKPOINT_REPOSITORY_TOKEN: ${{ steps.checkpoint-app-token.outputs.token }}
        run: >-
          node --disable-warning=ExperimentalWarning scripts/phase6-automation.js
          --owner dormichaeli
          --repository techmap_job_checkpoints
          --branch main
          --token-env CHECKPOINT_REPOSITORY_TOKEN
          --workspace "${{ runner.temp }}/techmap-job-automation"
          --cohort-policy rotating_verified_v1
          --limit 5
          --concurrency 2
          --cleanup true
