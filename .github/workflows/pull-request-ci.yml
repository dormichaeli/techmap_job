name: Pull request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up reviewed Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.1

      - name: Verify embedded SQLite runtime safety
        run: node --disable-warning=ExperimentalWarning scripts/verify-runtime.js

      - name: Run complete regression suite
        run: npm test
