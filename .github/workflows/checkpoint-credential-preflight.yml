name: Checkpoint GitHub App credential preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: techmap-job-authoritative-checkpoint
  cancel-in-progress: false

jobs:
  credential-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: checkpoint-production
    steps:
      - name: Restrict credential preflight to main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Credential preflight is restricted to refs/heads/main."
            exit 1
          fi

      - name: Check out reviewed preflight
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up reviewed Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.1

      - name: Fail closed unless embedded SQLite is safe
        run: node --disable-warning=ExperimentalWarning scripts/verify-runtime.js

      - name: Run complete regression suite before minting a token
        run: npm test

      - name: Mint repository-scoped read-only installation token
        id: checkpoint-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CHECKPOINT_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHECKPOINT_GITHUB_APP_PRIVATE_KEY }}
          owner: dormichaeli
          repositories: techmap_job_checkpoints
          permission-contents: read

      - name: Verify private checkpoint access and restoration without remote writes
        env:
          CHECKPOINT_GITHUB_APP_TOKEN: ${{ steps.checkpoint-app-token.outputs.token }}
        run: >-
          node --disable-warning=ExperimentalWarning scripts/phase8-credential-preflight.js
          --owner dormichaeli
          --repository techmap_job_checkpoints
          --token-env CHECKPOINT_GITHUB_APP_TOKEN
          --expected-checkpoint run-13-20261115T134602Z
          --workspace "${{ runner.temp }}/techmap-job-credential-preflight"
          --cleanup true
